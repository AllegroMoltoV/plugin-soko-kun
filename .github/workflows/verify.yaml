name: Verify attestations

# 掲載を待つ配布物の証明を検証し、新しい版のソースから通信の API を探し、結果を倉庫くんへ送る (ADR 0014、ADR 0016)。
# 倉庫くんは、このリポジトリの main で動くこのワークフローの OIDC のトークンだけを受け付ける。
# 第三者のデータを処理する scan ジョブには id-token を付けない。MCP Registry は OIDC のトークンの repository_owner だけで
# io.github.AllegroMoltoV/* の公開権限を与えるため、そのジョブで第三者のデータを処理するツールの脆弱性を突かれると、
# Registry の登録を書き換えられるトークンを発行されうる。トークンを取るのは、第三者のデータを処理しない prepare と report だけにする。
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-attestations
  cancel-in-progress: false

env:
  SOKO_KUN_ORIGIN: https://soko-kun.allegromoltov.jp
  # 通信の検出で第三者のソースを取り出すときに残す、ディスクの空き (3 GiB)。姉妹版と同じ値。
  MIN_FREE_BYTES: '3221225472'

jobs:
  # 検証待ちの一覧を受け取り、job output で scan へ渡す。
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
      has_work: ${{ steps.pending.outputs.has_work }}
    steps:
      - name: Fetch pending release files
        id: pending
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soko-kun" | jq -r '.value')
          curl -fsS -H "Authorization: Bearer ${token}" "${SOKO_KUN_ORIGIN}/internal/attestations/pending" > pending.json
          count=$(jq '.assets | length' pending.json)
          releases=$(jq '(.releases // []) | length' pending.json)
          echo "pending: ${count} assets, ${releases} releases for the network scan"
          if [ "${count}" -eq 0 ] && [ "${releases}" -eq 0 ]; then has_work=false; else has_work=true; fi
          # scan は一覧を環境変数で受け取る。Linux の環境変数 1 つの上限 (128 KiB) に収まらなければ止める。
          # 受け口が返すのは最大 50 件のため、通常は数十 KB に収まる。
          pending=$(jq -ac . pending.json)
          if [ "${#pending}" -gt 100000 ]; then
            echo "pending list is too large for an environment variable: ${#pending} bytes" >&2
            exit 1
          fi
          {
            echo "has_work=${has_work}"
            echo "pending=${pending}"
          } >> "${GITHUB_OUTPUT}"

  # 第三者の配布物とソースを取得して検証し、送る結果を job output で report へ渡す。OIDC のトークンは取らない。
  scan:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      body_0: ${{ steps.verify.outputs.body_0 }}
      body_1: ${{ steps.verify.outputs.body_1 }}
      body_2: ${{ steps.verify.outputs.body_2 }}
      body_3: ${{ steps.verify.outputs.body_3 }}
      body_4: ${{ steps.verify.outputs.body_4 }}
      body_5: ${{ steps.verify.outputs.body_5 }}
      body_6: ${{ steps.verify.outputs.body_6 }}
      body_7: ${{ steps.verify.outputs.body_7 }}
    steps:
      # 権限の付け間違いで、このジョブが OIDC のトークンを取れる状態になっていないことを確かめる。
      - name: Confirm that no OIDC token can be requested
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "The scan job must not have id-token: write." >&2
            exit 1
          fi
          echo "No OIDC token request variables are set."
      # 通信の検出のスクリプト (.github/scripts/scan-network.sh) を使うため。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pending release files
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PENDING: ${{ needs.prepare.outputs.pending }}
        run: |
          set -euo pipefail
          printf '%s' "${PENDING}" > pending.json
          count=$(jq '.assets | length' pending.json)
          releases=$(jq '(.releases // []) | length' pending.json)

          work=$(mktemp -d)
          echo '[]' > results.json
          echo '[]' > scans.json
          for i in $(seq 0 $((count - 1))); do
            item=$(jq -c ".assets[${i}]" pending.json)
            asset_id=$(jq -r '.assetId' <<< "${item}")
            url=$(jq -r '.downloadUrl' <<< "${item}")
            digest=$(jq -r '.digest' <<< "${item}")
            repository=$(jq -r '.repository' <<< "${item}")
            repository_id=$(jq -r '.repositoryId // empty' <<< "${item}")
            # 現在の名前、旧い名前 (新しい順) の順に試す。名前を変える前に作られた証明は、作られたときの名前でしか通らない (ADR 0015)。
            mapfile -t names < <(jq -r '.repository, (.previousRepositories // [])[]' <<< "${item}")
            tag=$(jq -r '.tag' <<< "${item}")
            commit=$(jq -r '.commitSha' <<< "${item}")
            signer=$(jq -r '.signerWorkflow // empty' <<< "${item}")
            file="${work}/asset-${asset_id}"
            result=error
            reason=download_failed
            signer_found=""

            # 配布物は実行せず、ハッシュと証明だけを確かめる。
            if curl -fsSL --max-filesize 1073741824 -o "${file}" "${url}"; then
              actual="sha256:$(sha256sum "${file}" | cut -d' ' -f1)"
              if [ "${actual}" != "${digest}" ]; then
                result=failed
                reason=digest_mismatch
              else
                result=failed
                reason=verification_failed
                for name in "${names[@]}"; do
                  args=(attestation verify "${file}" --repo "${name}" --source-ref "refs/tags/${tag}" --source-digest "${commit}" --format json)
                  if [ -n "${signer}" ]; then args+=(--signer-workflow "${name}/${signer}"); fi
                  if gh "${args[@]}" > "${work}/out.json" 2> "${work}/err.txt"; then
                    # 名前は別のリポジトリに使われうるため、証明書のリポジトリ ID が登録したものと同じことも確かめる。
                    found_id=$(jq -r '.[0].verificationResult.signature.certificate.sourceRepositoryIdentifier // empty' "${work}/out.json")
                    if [ -n "${repository_id}" ] && [ "${found_id}" != "${repository_id}" ]; then
                      reason=repository_id_mismatch
                      echo "  ${name}: repository id ${found_id} differs from ${repository_id}"
                      continue
                    fi
                    # buildSignerURI は https://github.com/<owner>/<repo>/<workflow のパス>@<ref> の形。
                    uri=$(jq -r '.[0].verificationResult.signature.certificate.buildSignerURI // empty' "${work}/out.json")
                    signer_found=$(sed -E 's#^https://github\.com/[^/]+/[^/]+/##; s#@.*$##' <<< "${uri}")
                    result=passed
                    reason=""
                    break
                  fi
                  echo "  ${name}: not verified"
                  sed 's/^/    /' "${work}/err.txt" | head -5
                done
              fi
            fi
            rm -f "${file}"
            echo "${repository} ${tag} asset ${asset_id}: ${result} ${reason}"
            jq --argjson id "${asset_id}" --arg result "${result}" --arg reason "${reason}" --arg signer "${signer_found}" \
              '. + [{assetId: $id, result: $result} + (if $reason == "" then {} else {reason: $reason} end) + (if $signer == "" then {} else {signerWorkflow: $signer} end)]' \
              results.json > results.next && mv results.next results.json
          done

          # 版ごとに、そのコミットのソースだけを取得して通信の API と、README 以外の文書の案内を探す。ソースは実行もビルドもしない (ADR 0016)。
          for i in $(seq 0 $((releases - 1))); do
            item=$(jq -c ".releases[${i}]" pending.json)
            release_id=$(jq -r '.releaseId' <<< "${item}")
            repository=$(jq -r '.repository' <<< "${item}")
            commit=$(jq -r '.commitSha' <<< "${item}")
            src="${work}/src-${release_id}"
            scan=""
            docs=""
            # 第三者のソースで、同じ回のほかの版の検証を止めないよう、取得と取り出しに時間の上限を付け、
            # 取り出しの前後でディスクの空きを確かめる。Git LFS のファイルは取得しない。足りなければその版は error にして先へ進む。
            if [[ "${repository}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] && [[ "${commit}" =~ ^[0-9a-f]{40}$ ]] \
                && [ "$(df --output=avail -B1 "${work}" | tail -1 | tr -d ' ')" -ge "${MIN_FREE_BYTES}" ]; then
              mkdir -p "${src}"
              if (cd "${src}" && export GIT_LFS_SKIP_SMUDGE=1 && git init -q \
                  && timeout 120 git fetch -q --depth 1 --no-tags "https://github.com/${repository}.git" "${commit}" \
                  && timeout 120 git checkout -q FETCH_HEAD) \
                  && [ "$(df --output=avail -B1 "${work}" | tail -1 | tr -d ' ')" -ge "${MIN_FREE_BYTES}" ]; then
                scan=$(timeout 60 bash .github/scripts/scan-network.sh "${src}" || true)
                # 同じ取り出しで、README 以外の文書の案内を照合する。どちらかが失敗した版は error として送り、やり直させる。
                docs=$(timeout 60 node .github/scripts/scan-docs.mjs "${src}" || true)
                if [ -z "${docs}" ]; then scan=""; fi
              fi
            fi
            rm -rf "${src}"
            if [ -n "${scan}" ]; then
              echo "${repository} ${commit}: $(jq '.hits | length' <<< "${scan}") network API hits, $(jq '.hits | length' <<< "${docs}") document hits"
              jq --argjson id "${release_id}" --argjson scan "${scan}" --argjson docs "${docs}" \
                '. + [{releaseId: $id, result: "done"} + $scan + {docHits: $docs.hits, docTruncated: $docs.truncated}]' \
                scans.json > scans.next && mv scans.next scans.json
            else
              echo "${repository} ${commit}: network scan error"
              jq --argjson id "${release_id}" '. + [{releaseId: $id, result: "error"}]' scans.json > scans.next && mv scans.next scans.json
            fi
          done

          # report は送る本文を環境変数で受け取る。Linux の環境変数 1 つの上限 (128 KiB) を超えうるため、
          # ASCII だけの JSON (jq -a) にして 100,000 バイトずつ最大 8 個の output に分ける。ASCII なのでバイト単位で切っても文字が壊れない。
          # 8 個の合計 800,000 バイトは job output の上限 (1 MB) に収まる。結果は最大 100 件、通信の検出は最大 5 版で、
          # 1 版あたり検出 50 件と文書 50 件 (本文は 160 文字まで) のため、通常はこの範囲に収まる。超えたら止める。
          body=$(jq -ac --slurpfile scans scans.json '{results: ., networkScans: $scans[0]}' results.json)
          chunk=100000
          if [ "${#body}" -gt $((chunk * 8)) ]; then
            echo "results are too large to pass to the report job: ${#body} bytes" >&2
            exit 1
          fi
          for k in 0 1 2 3 4 5 6 7; do
            echo "body_${k}=${body:$((k * chunk)):${chunk}}" >> "${GITHUB_OUTPUT}"
          done

  # scan の結果を倉庫くんへ送るだけにする。第三者のデータに由来する body は、展開も解析もせずにそのまま送り、形の検証は受け口に任せる。
  report:
    needs: [prepare, scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Send results
        env:
          BODY_0: ${{ needs.scan.outputs.body_0 }}
          BODY_1: ${{ needs.scan.outputs.body_1 }}
          BODY_2: ${{ needs.scan.outputs.body_2 }}
          BODY_3: ${{ needs.scan.outputs.body_3 }}
          BODY_4: ${{ needs.scan.outputs.body_4 }}
          BODY_5: ${{ needs.scan.outputs.body_5 }}
          BODY_6: ${{ needs.scan.outputs.body_6 }}
          BODY_7: ${{ needs.scan.outputs.body_7 }}
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soko-kun" | jq -r '.value')
          printf '%s' "${BODY_0}" "${BODY_1}" "${BODY_2}" "${BODY_3}" "${BODY_4}" "${BODY_5}" "${BODY_6}" "${BODY_7}" | curl -fsS -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' \
            --data-binary @- "${SOKO_KUN_ORIGIN}/internal/attestations/results"
