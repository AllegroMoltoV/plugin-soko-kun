name: Verify attestations

# 掲載を待つ配布物の証明を検証し、新しい版のソースから通信の API を探し、結果を倉庫くんへ送る (ADR 0014、ADR 0016)。
# 倉庫くんは、このリポジトリの main で動くこのワークフローの OIDC のトークンだけを受け付ける。
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-attestations
  cancel-in-progress: false

env:
  SOKO_KUN_ORIGIN: https://soko-kun.allegromoltov.jp

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # 通信の検出のスクリプト (.github/scripts/scan-network.sh) を使うため。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify pending release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          token() {
            curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soko-kun" | jq -r '.value'
          }
          curl -fsS -H "Authorization: Bearer $(token)" "${SOKO_KUN_ORIGIN}/internal/attestations/pending" > pending.json
          count=$(jq '.assets | length' pending.json)
          releases=$(jq '(.releases // []) | length' pending.json)
          echo "pending: ${count} assets, ${releases} releases for the network scan"
          if [ "${count}" -eq 0 ] && [ "${releases}" -eq 0 ]; then exit 0; fi

          work=$(mktemp -d)
          echo '[]' > results.json
          echo '[]' > scans.json
          for i in $(seq 0 $((count - 1))); do
            item=$(jq -c ".assets[${i}]" pending.json)
            asset_id=$(jq -r '.assetId' <<< "${item}")
            url=$(jq -r '.downloadUrl' <<< "${item}")
            digest=$(jq -r '.digest' <<< "${item}")
            repository=$(jq -r '.repository' <<< "${item}")
            repository_id=$(jq -r '.repositoryId // empty' <<< "${item}")
            # 現在の名前、旧い名前 (新しい順) の順に試す。名前を変える前に作られた証明は、作られたときの名前でしか通らない (ADR 0015)。
            mapfile -t names < <(jq -r '.repository, (.previousRepositories // [])[]' <<< "${item}")
            tag=$(jq -r '.tag' <<< "${item}")
            commit=$(jq -r '.commitSha' <<< "${item}")
            signer=$(jq -r '.signerWorkflow // empty' <<< "${item}")
            file="${work}/asset-${asset_id}"
            result=error
            reason=download_failed
            signer_found=""

            # 配布物は実行せず、ハッシュと証明だけを確かめる。
            if curl -fsSL --max-filesize 1073741824 -o "${file}" "${url}"; then
              actual="sha256:$(sha256sum "${file}" | cut -d' ' -f1)"
              if [ "${actual}" != "${digest}" ]; then
                result=failed
                reason=digest_mismatch
              else
                result=failed
                reason=verification_failed
                for name in "${names[@]}"; do
                  args=(attestation verify "${file}" --repo "${name}" --source-ref "refs/tags/${tag}" --source-digest "${commit}" --format json)
                  if [ -n "${signer}" ]; then args+=(--signer-workflow "${name}/${signer}"); fi
                  if gh "${args[@]}" > "${work}/out.json" 2> "${work}/err.txt"; then
                    # 名前は別のリポジトリに使われうるため、証明書のリポジトリ ID が登録したものと同じことも確かめる。
                    found_id=$(jq -r '.[0].verificationResult.signature.certificate.sourceRepositoryIdentifier // empty' "${work}/out.json")
                    if [ -n "${repository_id}" ] && [ "${found_id}" != "${repository_id}" ]; then
                      reason=repository_id_mismatch
                      echo "  ${name}: repository id ${found_id} differs from ${repository_id}"
                      continue
                    fi
                    # buildSignerURI は https://github.com/<owner>/<repo>/<workflow のパス>@<ref> の形。
                    uri=$(jq -r '.[0].verificationResult.signature.certificate.buildSignerURI // empty' "${work}/out.json")
                    signer_found=$(sed -E 's#^https://github\.com/[^/]+/[^/]+/##; s#@.*$##' <<< "${uri}")
                    result=passed
                    reason=""
                    break
                  fi
                  echo "  ${name}: not verified"
                  sed 's/^/    /' "${work}/err.txt" | head -5
                done
              fi
            fi
            rm -f "${file}"
            echo "${repository} ${tag} asset ${asset_id}: ${result} ${reason}"
            jq --argjson id "${asset_id}" --arg result "${result}" --arg reason "${reason}" --arg signer "${signer_found}" \
              '. + [{assetId: $id, result: $result} + (if $reason == "" then {} else {reason: $reason} end) + (if $signer == "" then {} else {signerWorkflow: $signer} end)]' \
              results.json > results.next && mv results.next results.json
          done

          # 版ごとに、そのコミットのソースだけを取得して通信の API を探す。ソースは実行もビルドもしない (ADR 0016)。
          for i in $(seq 0 $((releases - 1))); do
            item=$(jq -c ".releases[${i}]" pending.json)
            release_id=$(jq -r '.releaseId' <<< "${item}")
            repository=$(jq -r '.repository' <<< "${item}")
            commit=$(jq -r '.commitSha' <<< "${item}")
            src="${work}/src-${release_id}"
            scan=""
            if [[ "${repository}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] && [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
              mkdir -p "${src}"
              if (cd "${src}" && git init -q && timeout 120 git fetch -q --depth 1 "https://github.com/${repository}.git" "${commit}" \
                  && git checkout -q FETCH_HEAD); then
                scan=$(timeout 60 bash .github/scripts/scan-network.sh "${src}" || true)
              fi
            fi
            rm -rf "${src}"
            if [ -n "${scan}" ]; then
              echo "${repository} ${commit}: $(jq '.hits | length' <<< "${scan}") network API hits"
              jq --argjson id "${release_id}" --argjson scan "${scan}" '. + [{releaseId: $id, result: "done"} + $scan]' \
                scans.json > scans.next && mv scans.next scans.json
            else
              echo "${repository} ${commit}: network scan error"
              jq --argjson id "${release_id}" '. + [{releaseId: $id, result: "error"}]' scans.json > scans.next && mv scans.next scans.json
            fi
          done

          jq --slurpfile scans scans.json '{results: ., networkScans: $scans[0]}' results.json > body.json
          curl -fsS -X POST -H "Authorization: Bearer $(token)" -H 'Content-Type: application/json' \
            --data @body.json "${SOKO_KUN_ORIGIN}/internal/attestations/results"
